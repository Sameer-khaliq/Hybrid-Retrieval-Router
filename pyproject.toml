[project]
name = "hybrid-retrieval-router"
version = "0.1.0"
description = "Hybrid (BM25 + dense) retrieval with RRF fusion, cross-encoder reranking, and complexity-based query routing."
requires-python = ">=3.11"
dependencies = [
    "qdrant-client",
    "bm25s",
    "sentence-transformers",
    "groq",
    "google-genai",
    "tavily-python",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pypdf>=6.15.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "live_api: test makes a real call to Groq/Gemini/Tavily (skipped in CI, run locally with real keys only)",
]
pythonpath = "."
