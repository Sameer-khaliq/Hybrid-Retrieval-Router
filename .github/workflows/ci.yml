name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Qdrant instance for integration tests (Step 3, 7, 9) - this is
    # free/local, no API key needed, so it's safe to run in CI.
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334

    env:
      # Dummy values - NOT real keys. CI never calls the live Groq/Gemini/
      # Tavily APIs (that would burn free-tier quota on every push and
      # leak keys into logs). Tests that need those APIs mock them; see
      # the pytest marker note below.
      GROQ_API_KEY: dummy-ci-key
      GOOGLE_API_KEY: dummy-ci-key
      TAVILY_API_KEY: dummy-ci-key
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .
        continue-on-error: false

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:6333/collections && exit 0
            echo "waiting for qdrant... ($i)"
            sleep 2
          done
          echo "qdrant did not become ready in time" && exit 1

      - name: Run tests
        # "live_api" marks tests that would call real Groq/Gemini/Tavily -
        # excluded here on purpose (see NOTES.md / Step 1 addendum). Every
        # other test, including Qdrant-integration tests, runs for real
        # against the service container above.
        run: uv run pytest -v -m "not live_api" --maxfail=1

      - name: Upload eval report (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          if-no-files-found: ignore